<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>EFL Carbon Emission Management Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">EFL</div>
      <div class="brand-txt">
        <strong>Carbon Intelligence</strong>
        <span>Emission Management</span>
      </div>
    </div>

    <div class="nav-group">Monitor</div>
    <button class="nav-item active" data-view="dashboard"><span class="ico">◈</span>Executive Dashboard</button>
    <button class="nav-item" data-view="explorer"><span class="ico">◍</span>Emissions Explorer</button>
    <button class="nav-item" data-view="freight"><span class="ico">⛴</span>Freight &amp; Logistics</button>

    <div class="nav-group">Manage</div>
    <button class="nav-item" data-view="sources"><span class="ico">⇄</span>Data Sources</button>
    <button class="nav-item" data-view="quality"><span class="ico">⚠</span>Data Quality<span class="nav-badge" id="navAnomalies">5</span></button>
    <button class="nav-item" data-view="calculator"><span class="ico">∑</span>ISO 14083 Calculator</button>

    <div class="nav-group">Report</div>
    <button class="nav-item" data-view="reporting"><span class="ico">▤</span>Reporting Hub</button>
    <button class="nav-item" data-view="targets"><span class="ico">◎</span>Targets &amp; Pathway</button>
    <button class="nav-item" data-view="audit"><span class="ico">⛨</span>Methodology &amp; Audit</button>

    <div class="sidebar-foot">
      <div>Demo build · synthetic data</div>
      <div style="margin-top:4px">GLEC v3.2 · EN ISO 14083:2023</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="viewTitle">Carbon Emission Management Dashboard</h1>
        <div class="sub" id="viewSub">Group emissions position — FY2026 year to date</div>
      </div>
      <div class="topbar-right">
        <span class="chip">Data Update Time: <strong>2026-09-24</strong></span>
        <span class="chip">Period: <strong>Aug 2026</strong></span>
        <span class="chip ok">● Consolidation Locked</span>
        <span class="avatar" title="Pranith Fernando">PF</span>
      </div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
